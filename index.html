<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google // Retro Search</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="top-nav">
        <div class="nav-right">
            <a href="forms.html">FORMULÁŘE</a>
            <a href="images.html">OBRÁZKY</a>
            <a href="advanced.html">POKROČILÉ</a>
        </div>
    </header>

    <main class="main-content">
        <div class="pixel-logo">
            <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
        </div>

        <form action="https://www.google.com/search" method="GET" class="search-form">
            <div class="search-bar">
                <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="search-icon">
                    <path
                        d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z">
                    </path>
                </svg>
                <input type="text" name="q" required autocomplete="off" autofocus placeholder="Zadej hledaný výraz...">
            </div>

            <div class="search-buttons">
                <input type="submit" value="Hledat">
                <input type="submit" name="btnI" value="Mám štěstí">
            </div>
        </form>
    </main>

    <footer class="retro-footer">
        <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fdaniel-gorcica.github.io%2Fgooglesearch%2Findex.html"
            target="_blank">HTML VALID</a>
        <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Fdaniel-gorcica.github.io%2Fgooglesearch%2Findex.html&profile=css3svg"
            target="_blank">CSS VALID</a>
        <a href="https://github.com/daniel-gorcica/googlesearch/blob/main/citace.md" target="_blank">CITACE</a>
        <a href="https://daniel-gorcica.github.io/" target="_blank">PORTFOLIO</a>
    </footer>
</body>

</html>
