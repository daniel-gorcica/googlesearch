    <main class="advanced-content">
        <h1>VYHLEDÁVÁNÍ OBRÁZKŮ</h1>
        <hr>

        <form action="https://www.google.com/search" method="GET">
            <input type="hidden" name="tbm" value="isch">
            <div class="advanced-row">
                <label for="q">Hledat obrázky:</label>
                <input type="text" name="q" id="q" placeholder="např. rychlé auto" required>
                <span class="hint">Napište, jaký obrázek hledáte.</span>
            </div>
            <div class="advanced-submit">
                <input type="submit" value="HLEDAT OBRÁZKY">
            </div>
        </form>
    </main>
